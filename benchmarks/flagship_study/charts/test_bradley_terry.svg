<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Test Bradley-Terry relative strength</title>
<desc id="desc">Four competitive bots with pair-clustered bootstrap intervals and no external baseline.</desc>
<rect width="1200" height="760" fill="#FFFFFF"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202124}.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#5F6368}.axis{font-size:14px;fill:#5F6368}.label{font-size:16px}.small{font-size:13px}.legend{font-size:14px}</style>
<text class="title" x="60" y="62">Test relative strength</text>
<text class="subtitle" x="60" y="92">Bradley–Terry estimates; pair-clustered bootstrap 95% intervals</text>
<line x1="390.00" y1="190.00" x2="390.00" y2="620.00" stroke="#D9D9D9"/>
<text class="axis" x="390.00" y="650.00" text-anchor="middle">-1.47</text>
<line x1="510.00" y1="190.00" x2="510.00" y2="620.00" stroke="#D9D9D9"/>
<text class="axis" x="510.00" y="650.00" text-anchor="middle">-1.08</text>
<line x1="630.00" y1="190.00" x2="630.00" y2="620.00" stroke="#D9D9D9"/>
<text class="axis" x="630.00" y="650.00" text-anchor="middle">-0.70</text>
<line x1="750.00" y1="190.00" x2="750.00" y2="620.00" stroke="#D9D9D9"/>
<text class="axis" x="750.00" y="650.00" text-anchor="middle">-0.31</text>
<line x1="870.00" y1="190.00" x2="870.00" y2="620.00" stroke="#D9D9D9"/>
<text class="axis" x="870.00" y="650.00" text-anchor="middle">0.07</text>
<line x1="990.00" y1="190.00" x2="990.00" y2="620.00" stroke="#D9D9D9"/>
<text class="axis" x="990.00" y="650.00" text-anchor="middle">0.45</text>
<line x1="1110.00" y1="190.00" x2="1110.00" y2="620.00" stroke="#D9D9D9"/>
<text class="axis" x="1110.00" y="650.00" text-anchor="middle">0.84</text>
<line x1="848.33" y1="175.00" x2="848.33" y2="620.00" stroke="#5F6368" stroke-width="2" stroke-dasharray="6 6"/>
<text class="label" x="60" y="248.75">Neural alpha-beta (JacekInspiredBot) (20k nodes)</text>
<line x1="1001.47" y1="243.75" x2="1040.32" y2="243.75" stroke="#0072B2" stroke-width="6" stroke-linecap="round"/>
<circle cx="1020.76" cy="243.75" r="9" fill="#0072B2" stroke="#FFFFFF" stroke-width="2"/>
<text class="small" x="1110.00" y="229.75" text-anchor="end">0.55 [0.49, 0.61]</text>
<text class="label" x="60" y="356.25">Rank5DerivedBot — fixed 50k demo profile</text>
<line x1="966.07" y1="351.25" x2="1004.27" y2="351.25" stroke="#D55E00" stroke-width="6" stroke-linecap="round"/>
<circle cx="985.12" cy="351.25" r="9" fill="#D55E00" stroke="#FFFFFF" stroke-width="2"/>
<text class="small" x="1110.00" y="337.25" text-anchor="end">0.44 [0.38, 0.50]</text>
<text class="label" x="60" y="463.75">Hand-evaluated AlphaBetaBot (50k nodes)</text>
<line x1="885.91" y1="458.75" x2="921.33" y2="458.75" stroke="#009E73" stroke-width="6" stroke-linecap="round"/>
<circle cx="903.42" cy="458.75" r="9" fill="#009E73" stroke="#FFFFFF" stroke-width="2"/>
<text class="small" x="1110.00" y="444.75" text-anchor="end">0.18 [0.12, 0.23]</text>
<text class="label" x="60" y="571.25">Tactical MctsBot (1000 iter)</text>
<line x1="459.68" y1="566.25" x2="506.73" y2="566.25" stroke="#CC79A7" stroke-width="6" stroke-linecap="round"/>
<circle cx="484.02" cy="566.25" r="9" fill="#CC79A7" stroke="#FFFFFF" stroke-width="2"/>
<text class="small" x="1110.00" y="552.25" text-anchor="end">-1.16 [-1.24, -1.09]</text>
<text class="axis" x="750.00" y="700" text-anchor="middle">Relative log ability (sum constrained to zero)</text>
<text class="subtitle" x="60" y="730">n=4800 decisive games in 2400 color-swapped pairs. Zero is an identifiability convention, not absolute skill.</text></svg>
