<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paper Soccer Replay Viewer</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Paper Soccer</h1>
        <p id="replayTitle">Replay Viewer</p>
      </div>
      <label class="file-button">
        Load JSON
        <input id="fileInput" type="file" accept="application/json,.json">
      </label>
    </header>

    <main class="app-shell">
      <section class="board-panel" aria-label="Replay board">
        <canvas id="boardCanvas"></canvas>
      </section>

      <aside class="control-panel" aria-label="Replay controls">
        <div class="status-block">
          <div class="status-row">
            <span>Ply</span>
            <strong id="plyLabel">0 / 0</strong>
          </div>
          <div class="status-row">
            <span>State</span>
            <strong id="statusLabel">Ready</strong>
          </div>
          <div class="status-row">
            <span>Move</span>
            <strong id="moveLabel">Start</strong>
          </div>
        </div>

        <div class="button-row">
          <button id="startButton" type="button">Start</button>
          <button id="prevButton" type="button">Prev</button>
          <button id="playButton" type="button">Play</button>
          <button id="nextButton" type="button">Next</button>
          <button id="endButton" type="button">End</button>
        </div>

        <label class="range-row">
          <span>Timeline</span>
          <input id="plyRange" type="range" min="0" max="0" value="0">
        </label>

        <label class="range-row">
          <span>Speed</span>
          <input id="speedRange" type="range" min="0.5" max="4" step="0.5" value="1">
          <strong id="speedLabel">1x</strong>
        </label>

        <section class="move-list-section" aria-label="Move list">
          <h2>Moves</h2>
          <div id="moveList" class="move-list"></div>
        </section>
      </aside>
    </main>
