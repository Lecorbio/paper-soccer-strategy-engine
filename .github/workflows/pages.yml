name: CI and Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test-gcc:
    name: GCC build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: gcc
      CXX: g++
      PAPERSOCCER_BUILD_DIR: build/ci-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stabilize duplicate pragma-once headers
        run: |
          find submissions/codingame/bots -type f \
            \( -name replay_book.hpp \
            -o -name replay_value_model.hpp \
            -o -name teacher_residual_model.hpp \) \
            -exec touch -t 200001010000.00 {} +

      - name: Build and test
        run: ./scripts/build-and-test.sh

  test-clang:
    name: Clang build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      PAPERSOCCER_BUILD_DIR: build/ci-clang
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and test
        run: ./scripts/build-and-test.sh

  test-sanitizers:
    name: ASan and UBSan build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      PAPERSOCCER_BUILD_DIR: build/ci-sanitizers
      PAPERSOCCER_BUILD_TYPE: Debug
      PAPERSOCCER_ENABLE_SANITIZERS: "ON"
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and test
        run: ./scripts/build-and-test.sh

  deploy:
    needs: [test-gcc, test-clang, test-sanitizers]
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
