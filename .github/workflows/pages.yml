name: CI and Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# GNU Make treats `--parallel` without a count as unbounded.  The repository
# contains many large, generated CodinGame translation units, so cap hosted
# runner compilation to avoid memory-pressure kills while preserving coverage.
env:
  PAPERSOCCER_BUILD_JOBS: "2"

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  replay-training-contract:
    name: Jacek replay training contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pinned research dependency
        run: python3 -m pip install -r requirements-research.txt

      - name: Test feature, corpus, training, runtime, and promotion contracts
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest \
            tests.codingame.test_jacek_replay_features \
            tests.codingame.test_jacek_replay_corpus \
            tests.codingame.test_jacek_replay_training \
            tests.codingame.test_jacek_replay_promotion \
            tests.codingame.test_jacek_replay_workflow \
            tests.codingame.test_jacek_replay_baseline \
            tests.codingame.test_jacek_replay_tuning

      - name: Verify compact large-teacher evidence
        run: |
          python3 benchmarks/large_teacher_campaign/publish.py verify
          python3 benchmarks/large_teacher_campaign/publish.py test

  leaderboard-contract:
    name: Leaderboard contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate roster, schedule, ratings, and runner
        run: |
          for schema in benchmarks/codingame_leaderboard/*.schema.json; do
            python3 -m json.tool "$schema" >/dev/null
          done
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s tests/codingame_leaderboard -p 'test_*.py'
          python3 benchmarks/codingame_leaderboard/leaderboard.py validate

      - name: Replay and validate the frozen published snapshot
        run: |
          test -s benchmarks/codingame_leaderboard/tournament.json
          test -s web/leaderboard/leaderboard-results.js
          cmake -S . -B build/leaderboard-check -DCMAKE_BUILD_TYPE=Release
          cmake --build build/leaderboard-check --parallel 2 --target \
            papersoccer_codingame_referee
          python3 benchmarks/codingame_leaderboard/leaderboard.py validate \
            --artifact benchmarks/codingame_leaderboard/tournament.json \
            --referee build/leaderboard-check/papersoccer_codingame_referee \
            --allow-historical-sources
          python3 benchmarks/codingame_leaderboard/leaderboard.py publish \
            --input benchmarks/codingame_leaderboard/tournament.json \
            --output web/leaderboard/leaderboard-results.js \
            --referee build/leaderboard-check/papersoccer_codingame_referee \
            --allow-historical-sources --check

  test-gcc:
    name: GCC build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
      PAPERSOCCER_BUILD_DIR: build/ci-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned research dependency
        run: python3 -m pip install -r requirements-research.txt

      - name: Stabilize duplicate pragma-once headers
        run: |
          find submissions/codingame/bots -type f \
            \( -name replay_book.hpp \
            -o -name replay_value_model.hpp \
            -o -name teacher_residual_model.hpp \) \
            -exec touch -t 200001010000.00 {} +

      - name: Build and test
        run: ./scripts/build-and-test.sh

  test-clang:
    name: Clang build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      PAPERSOCCER_BUILD_DIR: build/ci-clang
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned research dependency
        run: python3 -m pip install -r requirements-research.txt

      - name: Build and test
        run: ./scripts/build-and-test.sh

  test-sanitizers:
    name: ASan and UBSan build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      PAPERSOCCER_BUILD_DIR: build/ci-sanitizers
      PAPERSOCCER_BUILD_TYPE: Debug
      PAPERSOCCER_ENABLE_SANITIZERS: "ON"
      PAPERSOCCER_CTEST_EXCLUDE_LABELS: long
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned research dependency
        run: python3 -m pip install -r requirements-research.txt

      - name: Build and test
        run: ./scripts/build-and-test.sh

  deploy:
    needs: [replay-training-contract, leaderboard-contract, test-gcc, test-clang, test-sanitizers]
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
